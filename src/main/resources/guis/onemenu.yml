# OneMenu — edit this file at plugins/BukkitOfUtils/guis/onemenu.yml
# Click actions (left-click / right-click lists):
#   player-command:<cmd>   — run as the player (without leading /)
#   console-command:<cmd>  — run as console (%player% replaced)
#   message:<text>         — send a message to the player
#   close                  — close the inventory
#   open-gui:<file.yml>    — open another GUI under plugins/BukkitOfUtils/guis/
#   firestring:<string>    — fire a FireString

title: "&6&lOne Menu"
