ext {
    // Libraries behind the bundled TheBase code (src/main/java/gg/drak/thebase). Shaded with
    // transitive=false and relocated under gg.drak.thebase.lib.* (see build.gradle): dependent
    // plugins import those relocated names directly, so they cannot come from Spigot libraries:.
    FRAMEWORK = [
            'gg.drak:SimplixStorage:3.4.0',
            'net.objecthunter:exp4j:0.4.8',
            'com.google.re2j:re2j:1.7',
    ]

    // Declared in plugin.yml and downloaded by Spigot (modern) or RuntimeLibraryLoader (legacy).
    // NEVER shaded — Spigot only resolves Maven Central and does not pull transitives.
    SPIGOT_LIBRARIES = [
            'com.zaxxer:HikariCP:5.1.0',
            'org.slf4j:slf4j-api:2.0.13',
            'org.xerial:sqlite-jdbc:3.46.1.0',
            'com.mysql:mysql-connector-j:8.0.33',
            'com.google.code.gson:gson:2.11.0',
            'com.github.ben-manes.caffeine:caffeine:3.1.8',
            'com.konghq:unirest-java:3.14.5',
            'org.apache.httpcomponents:httpclient:4.5.13',
            'org.apache.httpcomponents:httpcore:4.4.16',
            'org.apache.httpcomponents:httpmime:4.5.13',
            'org.apache.httpcomponents:httpasyncclient:4.1.5',
            'org.apache.httpcomponents:httpcore-nio:4.4.16',
            'commons-codec:commons-codec:1.15',
            'commons-logging:commons-logging:1.2',
    ]

    // Back-compat aliases used by older notes/scripts.
    IMPL = FRAMEWORK
    SHADOW = FRAMEWORK

    ANNO = [
            'org.spigotmc:spigot:1.16.5-R0.1-SNAPSHOT',
            'net.kyori:adventure-api:4.13.1',
    ]
    COMP_ONLY = [
            'org.spigotmc:spigot:1.16.5-R0.1-SNAPSHOT',
            'net.kyori:adventure-api:4.13.1',
            'org.jetbrains:annotations:24.0.1',
    ]
    FILES = [
    ]
    OTHER_PLUGINS = [
            'me.clip:placeholderapi:2.12.3',
            'net.luckperms:api:5.5',
    ]
}
