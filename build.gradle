plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6' // for shadowing
    id 'io.freefair.lombok' version '8.6'
    id 'maven-publish'
}

apply from: rootDir.toString() + '/dependencies.gradle'

group = properties['group']
version = properties['version']

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

ext {
    pluginMain = properties['plugin.main'] == 'default' ?
            "${project.group}.${project.name.toLowerCase()}.${project.name}" :
            properties['plugin.main']
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'

        content {
            includeGroup 'org.bukkit'
            includeGroup 'org.spigotmc'
        }
    }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://oss.sonatype.org/content/repositories/central' }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven { url 'https://repo.papermc.io/repository/maven-snapshots/' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://jitpack.io' }
    // NMS
    maven {
        url = uri("https://repo.codemc.org/repository/nms/")
    }
    // Streamline Essentials
    maven {
        url = uri("https://repo.codemc.io/repository/streamline-essentials/")
    }
}

dependencies {
    implementation(compileOnly(files(FILES)))
    annotationProcessor(ANNO)
    compileOnly(COMP_ONLY)
    compileOnly(OTHER_PLUGINS)

    // Framework: compile against full graph; shade only non-Central artifacts (no transitives).
    // Hikari / JDBC / Gson / etc. come from plugin.yml libraries: + RuntimeLibraryLoader.
    implementation(FRAMEWORK)
    FRAMEWORK.each { coord ->
        shadow(coord) { transitive = false }
    }

    // OblivateInvs — not on Maven Central; shade with its small modules, never Gson.
    implementation("mc.obliviate:core:4.1.13.3") {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    shadow("mc.obliviate:core:4.1.13.3") {
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    // Slim runtime: compile against Central libs, never package them.
    SPIGOT_LIBRARIES.each { coord ->
        compileOnly(coord)
    }
}

processResources {
    doFirst {
        println "Version: ${project.version}, Name: ${project.name}, Main: ${project.ext.pluginMain}"
        println "Spigot libraries (${project.ext.SPIGOT_LIBRARIES.size()}):"
        project.ext.SPIGOT_LIBRARIES.each { println "  - ${it}" }
    }

    inputs.property('name', "${project.name}")
    inputs.property('version', "${project.version}")
    inputs.property('main', "${project.ext.pluginMain}")
    inputs.property('libraries', project.ext.SPIGOT_LIBRARIES.join('|'))

    filesMatching('**/plugin.yml') {
        expand (
                'name': "${project.name}",
                'version': "${project.version}",
                'main': "${project.ext.pluginMain}",
                'librariesBlock': project.ext.SPIGOT_LIBRARIES.collect { "  - ${it}" }.join('\n'),
        )
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

shadowJar {
    archiveClassifier.set('')
    archiveFileName = "${project.name}-${project.version}.jar"

    // Only package the shadow configuration (framework + Oblivate), not the wider runtime classpath.
    configurations = [project.configurations.shadow]

    relocate('com.github.Anon8281.universalScheduler', 'host.plas.bou.libs.universalScheduler')

    // TheBase is published as a fat artifact. Strip anything Spigot `libraries:` /
    // RuntimeLibraryLoader already provides, plus unused fat-jar junk (junit/protobuf).
    exclude 'org/sqlite/**'
    exclude 'sqlite-jdbc.properties'
    exclude 'com/mysql/**'
    exclude 'mysql/**'
    exclude 'com/zaxxer/hikari/**'
    exclude 'com/google/gson/**'
    exclude 'com/github/benmanes/caffeine/**'
    exclude 'kong/unirest/**'
    exclude 'org/apache/http/**'
    exclude 'org/apache/commons/codec/**'
    exclude 'org/apache/commons/logging/**'
    exclude 'org/slf4j/**'
    exclude 'org/junit/**'
    exclude 'com/google/protobuf/**'
    exclude 'google/protobuf/**'
    exclude 'com/esotericsoftware/yamlbeans/**'

    // TheBase relocates JDBC stack under gg.drak.thebase.lib — drop those copies too.
    exclude 'gg/drak/thebase/lib/mysql/**'
    exclude 'gg/drak/thebase/lib/hikari/**'
    exclude 'gg/drak/thebase/lib/sqlite/**'

    exclude 'META-INF/maven/org.junit.*/**'
    exclude 'META-INF/maven/com.zaxxer/HikariCP/**'
    exclude 'META-INF/maven/org.xerial/sqlite-jdbc/**'
    exclude 'META-INF/maven/com.mysql/**'
    exclude 'META-INF/maven/mysql/**'
    exclude 'META-INF/maven/com.google.protobuf/**'
    exclude 'META-INF/maven/com.google.code.gson/**'
    exclude 'META-INF/maven/com.github.ben-manes.caffeine/**'
    exclude 'META-INF/maven/com.konghq/**'
    exclude 'META-INF/maven/org.apache.httpcomponents/**'
    exclude 'META-INF/maven/commons-codec/**'
    exclude 'META-INF/maven/commons-logging/**'
    exclude 'META-INF/maven/org.slf4j/**'
}

artifacts {
    archives shadowJar
}

wrapper {
    gradleVersion = '8.9'
    distributionType = Wrapper.DistributionType.ALL
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId project.group
            artifactId "$project.name"
            version project.version

            from components.java
        }
    }

    repositories {
        maven {
            url = "https://repo.codemc.io/repository/streamline-essentials/"

            def mavenUsername = System.getenv("JENKINS_NEXUS_USERNAME")
            def mavenPassword = System.getenv("JENKINS_NEXUS_PASSWORD")

            if (mavenUsername != null && mavenPassword != null) {
                credentials {
                    username = mavenUsername
                    password = mavenPassword
                }
            }
        }
    }
}
